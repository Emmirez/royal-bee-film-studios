<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1c1b19" />
    <title>You're offline · Royal Bee Film Studios</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #faf8f4;
        color: #1c1b19;
        font-family: Manrope, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
      }
      main { max-width: 380px; }
      img { width: 72px; height: 72px; border-radius: 18px; }
      h1 { margin: 24px 0 8px; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 32px; font-weight: 600; }
      p { margin: 0 0 24px; color: #5c574f; line-height: 1.6; font-size: 15px; }
      button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 0 28px;
        border: 0;
        border-radius: 999px;
        background: #1c1b19;
        color: #faf8f4;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:focus-visible { outline: 3px solid #c9a961; outline-offset: 3px; }
      small { display: block; margin-top: 20px; color: #7a746a; font-size: 12px; }
      @media (prefers-color-scheme: dark) {
        body { background: #1c1b19; color: #faf8f4; }
        p { color: #d9d1c3; }
        button { background: #c9a961; color: #1c1b19; }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/android-chrome-192x192.png" alt="Royal Bee Film Studios" />
      <h1>You're offline</h1>
      <p>Royal Bee needs an internet connection. Check your Wi-Fi or mobile data, then try again. Nothing you saved has been lost.</p>
      <button type="button" onclick="location.reload()">Try again</button>
      <small>This page will reload automatically when you're back online.</small>
    </main>
    <script>
      window.addEventListener('online', function () { location.reload(); });
    </script>
  </body>
</html>
